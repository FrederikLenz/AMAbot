<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AMA</title>

    <link rel="stylesheet" href="/styles.css">
    <script src="/scripts.js" defer></script>
</head>

<body>

    <div class="ama-app">

        <!-- =================================
             SIDEBAR
        ================================== -->

        <aside class="sidebar">

            <!-- Sidebar header -->
            <header class="sidebar-header">

                <div class="logo">
                    <div class="logo-icon">
                        <!-- AMA icon -->
                    </div>

                    <span class="logo-text">AMA</span>
                </div>

            </header>


            <!-- Host profile -->
            <section class="profile">
                <div class="profile-image-wrapper">
                    <img class="profile-image" src="/images/cæsar.jpg" alt="Profile picture">
                </div>
            </section>


            <!-- Topic stats -->
            <section class="topic-stats">
                <h2>Spørgsmål fordelt på emner</h2>

                <ul>
                    <li>
                        <span>Navn</span>
                        <span class="topic-count"></span>
                    </li>
                    <li>
                        <span>Bosted</span>
                        <span class="topic-count"></span>
                    </li>
                    <li>
                        <span>Fritid</span>
                        <span class="topic-count"></span>
                    </li>
                </ul>
            </section>


            <!-- New session -->
            <div class="sidebar-footer">

                <form action="/reset" method="POST">
                    <button
                        class="new-session-button"
                        type="submit"
                    >
                        New session
                    </button>
                </form>

            </div>

        </aside>


        <!-- =================================
             MAIN
        ================================== -->

        <main class="main">

            <!-- Main header -->
            <header class="main-header">

                <div class="header-content">

                    <h1>Ask Me Anything</h1>

                    <p>No topic is off limits</p>

                </div>

            </header>


            <!-- =================================
                 CHAT
            ================================== -->

            <section class="chat">

                <div class="messages">

                        <div class="empty-state">
                            <h2>Ingen spørgsmål endnu</h2>
                            <p>Stil dit første spørgsmål herunder</p>
                        </div>

                        <div class="message message-">
                            <p></p>
                        </div>

                </div>


                <!-- =================================
                     QUESTION FORM
                ================================== -->

                <form class="question-form" action="/ask" method="POST">

                    <div class="input-container">

                        <label class="sr-only" for="question">Stil dit spørgsmål her:</label>
                        <input id="question" name="question" type="text" placeholder="Stil dit spørgsmål her..." autocomplete="off"/>
                        
                        <button class="send-button" type="submit">
                            <span>Send</span>

                            <span class="send-icon">
                                ↑
                            </span>
                        </button>

                    </div>

                        <p class="form-error" role="alert"></p>

                    <div class="char-counter">
                        <span id="char-count">0</span>/280
                    </div>

                </form>
                
                

            </section>

        </main>

    </div>

</body>
</html>
